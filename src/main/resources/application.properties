# ═══════════════════════════════════════════════════════════════════════════════
# APPLICATION PROPERTIES — The "control panel" of your Spring Boot application
# ═══════════════════════════════════════════════════════════════════════════════
# This file is automatically loaded by Spring Boot at startup.
# It configures everything: database connections, server settings, logging, etc.
# Think of it as the "settings menu" for your application.
# ═══════════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────────────
# APPLICATION NAME
# ──────────────────────────────────────────────────────────────────────────────
# Used in logs, actuator endpoints, and monitoring tools to identify this app.
spring.application.name=student-crud-jdbc

# ──────────────────────────────────────────────────────────────────────────────
# SERVER CONFIGURATION
# ──────────────────────────────────────────────────────────────────────────────
# The port on which the embedded Tomcat server listens.
# Default is 8080. Change if another app is already using 8080.
server.port=8080

# ──────────────────────────────────────────────────────────────────────────────
# DATABASE CONNECTION
# ──────────────────────────────────────────────────────────────────────────────
# spring.datasource.url → The JDBC connection string. Format:
#   jdbc:postgresql://<host>:<port>/<database_name>
#
#   • jdbc:postgresql:// → Tells Java to use the PostgreSQL JDBC driver
#   • localhost          → Database is on the same machine (change for remote DBs)
#   • 5432               → Default PostgreSQL port
#   • student_db         → Name of the database we created
#
# Analogy: This is like the full address of a building:
#          "Go to PostgreSQL Street, Building 5432, Apartment student_db"
spring.datasource.url=jdbc:postgresql://localhost:5432/student_db

# spring.datasource.username → The database user that the app logs in as.
# In production, use a dedicated app user with limited permissions, NOT 'postgres' (superuser).
spring.datasource.username=postgres

# spring.datasource.password → Password for the database user.
# ⚠️ SECURITY NOTE: In production, NEVER hardcode passwords here.
# Use environment variables, Spring Cloud Config, or a secrets manager like HashiCorp Vault.
# Example with env variable: spring.datasource.password=${DB_PASSWORD}
spring.datasource.password=your_password_here

# spring.datasource.driver-class-name → Fully qualified class name of the JDBC driver.
# Spring Boot auto-detects this from the URL, but being explicit is a good practice
# for clarity and to avoid ambiguity if multiple drivers are on the classpath.
spring.datasource.driver-class-name=org.postgresql.Driver

# ──────────────────────────────────────────────────────────────────────────────
# HIKARICP CONNECTION POOL CONFIGURATION
# ──────────────────────────────────────────────────────────────────────────────
# HikariCP is the DEFAULT connection pool in Spring Boot (and the fastest in Java).
#
# WHY CONNECTION POOLING?
# Creating a new database connection is EXPENSIVE (~10-50ms). If every request
# creates and destroys a connection, your app slows down dramatically under load.
# A connection pool keeps a "pool" of pre-created connections ready to use.
#
# Analogy: Instead of digging a new well every time you're thirsty (creating a
#          new DB connection), you have a water tank (pool) that's always full.
#          You just turn the tap (borrow a connection) and return the water
#          when done (return the connection to the pool).

# Maximum number of connections the pool will maintain.
# Rule of thumb: connections = (CPU cores * 2) + number_of_disks
# For a 4-core machine with 1 disk: (4 * 2) + 1 = 9 ≈ 10
# Going too high causes thread contention and actually SLOWS things down.
spring.datasource.hikari.maximum-pool-size=10

# Minimum number of idle connections kept ready in the pool.
# These connections are pre-created and waiting, so requests don't have to wait
# for a connection to be established.
spring.datasource.hikari.minimum-idle=5

# How long (ms) a client will wait for a connection from the pool before throwing
# an exception. 30 seconds is a reasonable timeout.
spring.datasource.hikari.connection-timeout=30000

# Maximum time (ms) a connection can sit IDLE in the pool before being destroyed.
# This prevents stale connections from accumulating. 600000ms = 10 minutes.
spring.datasource.hikari.idle-timeout=600000

# Maximum LIFETIME (ms) of a connection in the pool, regardless of activity.
# This ensures connections are periodically refreshed, preventing issues with
# database-side timeouts or firewall rules that kill long-lived connections.
# 1800000ms = 30 minutes.
spring.datasource.hikari.max-lifetime=1800000

# ──────────────────────────────────────────────────────────────────────────────
# SQL INITIALIZATION
# ──────────────────────────────────────────────────────────────────────────────
# Tells Spring Boot to run schema.sql on startup to create tables.
# 'always' → Run every time the app starts (safe because we use IF NOT EXISTS).
# 'embedded' → Only for embedded DBs (H2, HSQL) — default.
# 'never' → Skip SQL initialization entirely.
spring.sql.init.mode=always

# ──────────────────────────────────────────────────────────────────────────────
# LOGGING CONFIGURATION
# ──────────────────────────────────────────────────────────────────────────────
# Root logging level — INFO shows important lifecycle events without being noisy.
logging.level.root=INFO

# Our application's logging level — DEBUG during development to see detailed
# flow through controllers, services, and repositories.
logging.level.com.student=DEBUG

# Log SQL queries executed by JdbcTemplate for debugging.
# Set to TRACE to also see parameter bindings.
logging.level.org.springframework.jdbc.core=DEBUG

# Log format pattern — includes timestamp, log level, thread, logger name, and message.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%level] [%thread] %logger{36} - %msg%n
